# Публикация нашей сборки TAB в свой Reposilite.
#
# ЭТОТ РЕПОЗИТОРИЙ ПУБЛИЧНЫЙ, поэтому `runs-on` здесь — только раннеры GitHub и
# никогда `self-hosted`. Правило записано в вики (infra/ci.md, «Граница
# безопасности: только приватные репозитории»), и обе группы раннеров организации
# имеют `allows_public_repositories=false`. Причина в том, что PR из чужого форка
# исполняет workflow ИЗ САМОГО PR, то есть автор форка волен дописать
# `runs-on: self-hosted` и получить исполнение своего кода на хосте, где работает
# игровой сервер. Тот же комментарий стоит в XMineServer/Paper.
#
# Отсюда же остальные меры: триггера `pull_request` нет вовсе, push ограничен
# нашими ветками `xmine/**`, а job не запускается в форках самого форка.

name: XMine - publish TAB

on:
  push:
    branches: ['xmine/**']
  workflow_dispatch:

# Публикация не должна идти в два потока: параллельные сборки означали бы гонку
# за то, чья попадёт под координату.
concurrency:
  group: xmine-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Форки самого форка не должны пытаться публиковать в наш Reposilite.
    if: github.repository == 'XMineServer/TAB'
    runs-on: ubuntu-latest

    env:
      XMINE_MAVEN_USERNAME: ${{ secrets.XMINE_MAVEN_USERNAME }}
      XMINE_MAVEN_PASSWORD: ${{ secrets.XMINE_MAVEN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fail early without credentials
        run: |
          # Без учётки сборка дошла бы до конца и упала на последнем шаге, потратив
          # десятки минут на компиляцию всех платформ. Дешевле проверить сразу.
          if [ -z "${XMINE_MAVEN_USERNAME:-}" ] || [ -z "${XMINE_MAVEN_PASSWORD:-}" ]; then
            echo "::error::Secrets XMINE_MAVEN_USERNAME / XMINE_MAVEN_PASSWORD are not set"
            exit 1
          fi

      - name: Build
        # Именно `build`, а не `:jar:shadowJar`: у проекта включён
        # org.gradle.configureondemand, и при вызове одной задачи из :jar соседние
        # модули конфигурируются не до конца — compile classpath приезжает пустым, и
        # сборка падает на «package org.bukkit does not exist». Апстримный
        # .github/workflows/build.yml по той же причине зовёт `./gradlew build`.
        run: ./gradlew build --stacktrace

      - name: Verify the universal jar
        run: |
          # Нам нужна универсальная сборка (та, что стоит на прокси), а не
          # Paper-специфичная «broken Paper»: проверяем, что в jar есть класс
          # велосити-платформы. Заодно проверяем, что зашейженный snakeyaml
          # приехал вместе с пакетом env — без него правка не работает, а
          # заметить это можно было бы только в рантайме на проде.
          set -eu
          VERSION="$(sed -n 's/^ *version = "\(.*\)"$/\1/p' build.gradle.kts | head -1)"
          JAR="jar/build/libs/TAB v${VERSION}.jar"
          echo "Jar: $JAR"
          unzip -l "$JAR" | grep -q 'me/neznamy/tab/platforms/velocity/VelocityTAB.class'
          unzip -l "$JAR" | grep -q 'me/neznamy/tab/libs/org/yaml/snakeyaml/env/EnvScalarConstructor.class'
          unzip -l "$JAR" | grep -q 'me/neznamy/tab/shared/config/file/YamlConfigurationFile$StrictEnvScalarConstructor.class'
          SHA="$(sha256sum "$JAR" | cut -d" " -f1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "JAR_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "sha256: $SHA"

      - name: Publish
        run: ./gradlew :jar:publishXminePublicationToXmineRepository --stacktrace

      - name: Report coordinate
        run: |
          # sha256 печатается, чтобы обратную сверку скачанного из Reposilite
          # можно было сделать против того, что реально собралось здесь.
          {
            echo "### Published"
            echo '```'
            echo "ru.xmine.thirdparty:tab:${VERSION}"
            echo "sha256  ${JAR_SHA256}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
